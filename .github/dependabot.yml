# Version-update pull requests are off (limit 0): dependencies are bumped by hand on main.
# Dependabot alerts are a repository setting and are not affected by this file.
version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
  # requirements.lock is compiled with uv (scripts/relock.sh), which Dependabot
  # cannot run. With increase-if-necessary Dependabot only edits requirements.txt
  # when a new release falls outside the declared range; in-range updates are
  # left to the weekly relock workflow (.github/workflows/relock.yml). The CI
  # step "Verify source requirements agree with the lock" fails any PR that
  # raises a bound above the locked version, so those PRs need a manual relock.
  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    ignore:
      # The CPU wheel only exists on the PyTorch index; Dependabot resolves
      # against PyPI and cannot regenerate the uv-compiled lock.
      - dependency-name: torch
