name: Relock

# Weekly refresh of requirements.lock (compiled with uv, which Dependabot cannot
# run). Opens at most ONE pull request at a time, on a fresh branch per run;
# never merges, never force-pushes, never deletes a branch.
#
# Limitation: pull requests created with the built-in GITHUB_TOKEN do not
# trigger pull_request workflows, so the normal CI workflow will not start on
# the relock PR. This job therefore runs the tests and the agreement check
# against the new lock itself and reports the result in the PR body. To get the
# full CI matrix, close and reopen the PR (or push an empty commit) by hand.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relock
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/relock-${{ github.run_id }}
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true # needed to push the relock branch below
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Stop if a relock pull request is already open
        id: existing
        run: |
          open=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/relock-"))][0].number // empty')
          if [ -n "$open" ]; then
            echo "::notice::Relock pull request #$open is still open; merge or close it before the next relock."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.existing.outputs.skip == 'false'
        run: python -m pip install uv
      - name: Compile lock
        if: steps.existing.outputs.skip == 'false'
        run: scripts/relock.sh --compile-only
      - name: Detect changes
        id: diff
        if: steps.existing.outputs.skip == 'false'
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "requirements.lock is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies from the new lock
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps "torch==2.14.0+cpu"
          python -m pip install -r requirements.lock
      - name: Run unit tests
        if: steps.diff.outputs.changed == 'true'
        shell: bash # bash -e -o pipefail: a failing test run fails the step despite tee
        run: python -m unittest discover -s tests -v 2>&1 | tee test.log
      - name: Verify source requirements agree with the lock
        if: steps.diff.outputs.changed == 'true'
        run: scripts/relock.sh --check-only
      - name: Check installed dependencies
        if: steps.diff.outputs.changed == 'true'
        run: python -m pip check
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          tests_summary=$(tail -n 3 test.log | tr '\n' ' ')
          rm -f test.log
          git config user.name "Asadbek Bobojonov"
          git config user.email "121876874+asadbek066@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add requirements.lock
          git commit -m "chore(deps): relock requirements.lock"
          # A new branch per run: nothing is ever overwritten.
          git push origin "$BRANCH"
          cat > body.md <<BODY
          ## Problem
          Scheduled refresh of \`requirements.lock\`.

          ## Changes
          \`scripts/relock.sh --compile-only\` regenerated the lock; only that file changed.

          ## Verification
          Run by the relock workflow against the new lock (Python 3.12):
          - unit tests: ${tests_summary}
          - agreement check (\`pip install --dry-run --no-index -r requirements.txt -r requirements.lock\`): passed
          - \`pip check\`: passed

          ## CI
          This PR was opened with GITHUB_TOKEN, so the CI workflow does not start automatically (and Python 3.11 is not covered above). Close and reopen the PR to run it.

          ## Risk
          Transitive dependency versions move; review the diff.

          ## Rollback
          Close the PR; nothing is merged automatically.
          BODY
          gh pr create --head "$BRANCH" --base "$BASE" \
            --title "chore(deps): relock requirements.lock" --body-file body.md
